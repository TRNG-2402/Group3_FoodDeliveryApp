name: Frontend CI

on:
    push: 
        branches: [main] 
        paths: 
          - 'FoodDeliveryAppFront/FoodDeliveryAppUI/**'
          - '.github/workflows/frontend-ci.yml'
    
    pull_request:
        branches: [main]
        paths: 
          - 'FoodDeliveryAppFront/FoodDeliveryAppUI/**'
          - '.github/workflows/frontend-ci.yml'

    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        working-directory: FoodDeliveryAppFront/FoodDeliveryAppUI

jobs:

    lint-test:
        name: Lint and run unit tests
        runs-on: ubuntu-latest 
        steps:
            
          - name: Checkout repository 
            uses: actions/checkout@v6

          - name: Set up Node.js
            uses: actions/setup-node@v4
            with: 
                node-version: '24'
                cache: "npm"
                cache-dependency-path: FoodDeliveryAppFront/FoodDeliveryAppUI/package-lock.json
            
          - name: Install dependencies
            run: npm ci

          - name: Lint
            run: npm run lint

          - name: Test
            run: npm run test:ci

    build: 
        name: Production build
        needs: lint-test 
        runs-on: ubuntu-latest  
        steps: 
        
          - name: Checkout repository
            uses: actions/checkout@v6

          - name: Setup Node.js 
            uses: actions/setup-node@v4
            with: 
                node-version: '24'
                cache: npm
                cache-dependency-path: FoodDeliveryAppFront/FoodDeliveryAppUI/package-lock.json

          - name: Install dependencies
            run: npm ci
        
          - name: Build
            run: npm run build
            env: 
                VITE_Google_Map_API_Key: ${{ secrets.VITE_Google_Map_API_Key }} 

          - name: Upload dist artifact
            uses: actions/upload-artifact@v4
            with:
                name: webstorefront-dist
                path: FoodDeliveryAppFront/FoodDeliveryAppUI/dist
                retention-days: 7

    docker:
        name: Docker image build
        needs: build
        runs-on: ubuntu-latest
        steps: 
        
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Download dist artifact
            uses: actions/download-artifact@v4
            with:
                name: webstorefront-dist
                path: FoodDeliveryAppFront/FoodDeliveryAppUI/dist


          - name: Log in to Dockerhub
            uses: docker/login-action@v3
            with: 
              username: ${{ vars.DOCKER_HUB_USERNAME }}
              password: ${{ secrets.DOCKER_HUB_TOKEN }}


          - name: Compute image tags
            id: meta 
            uses: docker/metadata-action@v5
            with:
              images: ${{ vars.DOCKER_HUB_USERNAME }}/fooddeliveryapp-ui 
              tags: | 
                type=raw, value=latest,enable={{is_default_branch}} 
                type=sha, format=short


          - name: Build and push to Dockerhub
            uses: docker/build-push-action@v6
            with: 
              context: FoodDeliveryAppFront/FoodDeliveryAppUI
              push: true 
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              build-args: VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
